name: Build Midnight Drift

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          set -e
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          tpl="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d /tmp/tpl
          mv /tmp/tpl/templates/* "$tpl/"
          rm -f ./*.zip ./*.tpz

      - name: Import project
        run: timeout 300 ./godot --headless --editor --quit --path . 2>&1 | tee import.log || true

      - name: Smoke test (headless – scripts, physics, networking)
        run: |
          timeout 500 ./godot --headless --path . -- --smoke-test 2>&1 | tee smoke.log || true
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error" smoke.log; then echo "::error::Script errors found"; exit 1; fi
          grep -q "SMOKE TEST OK" smoke.log

      - name: Render test (software Vulkan, screenshots)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libvulkan1 > /dev/null
          mkdir -p shots
          timeout 1500 xvfb-run -a -s "-screen 0 1600x900x24" ./godot --path . --rendering-driver vulkan -- --smoke-test --shot-dir="$PWD/shots" 2>&1 | tee render.log || true
          if grep -E "SHADER ERROR|SCRIPT ERROR|shader compilation failed" render.log; then echo "::error::Render errors found"; exit 1; fi
          grep -q "SMOKE TEST OK" render.log

      - name: Upload test logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            smoke.log
            render.log
            shots/
          if-no-files-found: ignore

      - name: Export Windows (.exe) and Linux
        run: |
          mkdir -p build/windows build/linux
          ./godot --headless --path . --export-release "Windows Desktop" build/windows/MidnightDrift.exe 2>&1 | tee export.log
          ./godot --headless --path . --export-release "Linux" build/linux/MidnightDrift.x86_64 2>&1 | tee -a export.log
          ls -la build/windows build/linux
          test -s build/windows/MidnightDrift.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: MidnightDrift-Windows
          path: build/windows/

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: MidnightDrift-Linux
          path: build/linux/

      - name: Package release zips
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd build/windows && zip -q -r ../MidnightDrift-Windows.zip . && cd ../..
          cd build/linux && zip -q -r ../MidnightDrift-Linux.zip . && cd ../..

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/MidnightDrift-Windows.zip
            build/MidnightDrift-Linux.zip
