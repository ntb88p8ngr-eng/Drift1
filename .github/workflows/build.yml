name: Build Midnight Drift

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          set -e
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          tpl="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d /tmp/tpl
          mv /tmp/tpl/templates/* "$tpl/"
          rm -f ./*.zip ./*.tpz

      - name: Import project
        run: timeout 300 ./godot --headless --editor --quit --path . 2>&1 | tee import.log || true

      - name: Compile all scripts
        run: |
          timeout 120 ./godot --headless --path . res://tests/check_scripts.tscn 2>&1 | tee check.log || true
          if grep -E "SCRIPT CHECK FAILED|Parse Error|Compile Error|SCRIPT ERROR" check.log; then echo "::error::Script compile errors"; exit 1; fi
          grep -q "SCRIPT CHECK DONE" check.log

      - name: Audio test (engine voices, R34 samples)
        run: |
          mkdir -p "$RUNNER_TEMP/audio"
          timeout 120 ./godot --headless --path . res://tests/audio_test.tscn -- "$RUNNER_TEMP/audio" 2>&1 | tee audio.log || true
          if grep -E "SCRIPT ERROR|AUDIO NAN|AUDIO SAMPLES MISSING" audio.log; then echo "::error::Audio test failed"; exit 1; fi
          grep -q "AUDIO TEST DONE" audio.log
          timeout 60 ./godot --headless --path . res://tests/rain_audio_test.tscn -- "$RUNNER_TEMP/audio" 2>&1 | tee -a audio.log || true
          grep -q "RAIN TEST DONE" audio.log

      - name: Drive test (terrain collision, gearing, weather grip)
        run: |
          timeout 240 ./godot --headless --path . res://tests/drive_test.tscn 2>&1 | tee drive.log || true
          if grep -E "SCRIPT ERROR" drive.log; then echo "::error::Drive test failed"; exit 1; fi
          grep -q "DRIVE m3gt3 y range" drive.log

      - name: Handling test (burnout to the limiter, held drift keeps its speed)
        run: |
          timeout 300 ./godot --headless --path . res://tests/handling_test.tscn 2>&1 | tee handling.log || true
          if grep -E "SCRIPT ERROR" handling.log; then echo "::error::Handling test failed"; exit 1; fi
          grep -q "HANDLING TEST OK" handling.log

      - name: Shift test (full throttle in auto - with grip the revs follow the road speed, no hole after the shift)
        run: |
          timeout 200 ./godot --headless --path . res://tests/shift_test.tscn 2>&1 | tee shift.log || true
          if grep -E "SCRIPT ERROR" shift.log; then echo "::error::Shift test failed"; exit 1; fi
          grep -q "SHIFT TEST OK" shift.log

      - name: Menu gamepad test ((A) confirms, (B) goes back, every screen focused)
        run: |
          timeout 120 ./godot --headless --path . res://tests/menu_pad_test.tscn 2>&1 | tee menupad.log || true
          if grep -E "SCRIPT ERROR" menupad.log; then echo "::error::Menu gamepad test failed"; exit 1; fi
          grep -q "MENU PAD TEST: PASS" menupad.log

      - name: Lift test (offroad ride height really raises the body)
        run: |
          timeout 120 ./godot --headless --path . res://tests/lift_test.tscn 2>&1 | tee lift.log || true
          if grep -E "SCRIPT ERROR" lift.log; then echo "::error::Lift test failed"; exit 1; fi
          grep -q "LIFT TEST: PASS" lift.log

      - name: Camera test (no jitter at 75 fps with 120 Hz physics)
        run: |
          timeout 240 ./godot --headless --fixed-fps 75 --path . res://tests/camera_test.tscn 2>&1 | tee camera.log || true
          if grep -E "SCRIPT ERROR" camera.log; then echo "::error::Camera test failed"; exit 1; fi
          grep -q "CAMERA TEST OK" camera.log

      - name: Collision test (breakable lamp, solid grandstand)
        run: |
          timeout 240 ./godot --headless --path . res://tests/collision_test.tscn 2>&1 | tee collision.log || true
          if grep -E "SCRIPT ERROR" collision.log; then echo "::error::Collision test failed"; exit 1; fi
          grep -q "COLLISION TEST OK" collision.log

      - name: Track test (Grüne Hölle: car rests on the road all around the lap)
        run: |
          timeout 600 ./godot --headless --path . res://tests/track_test.tscn -- --track=gruene_hoelle 2>&1 | tee track.log || true
          if grep -E "SCRIPT ERROR" track.log; then echo "::error::Track test failed"; exit 1; fi
          grep -q "TRACK: PASS" track.log

      - name: Underglow test (flasher off stays steady, flash key strobes)
        run: |
          timeout 120 ./godot --headless --path . res://tests/underglow_test.tscn 2>&1 | tee underglow.log || true
          if grep -E "SCRIPT ERROR" underglow.log; then echo "::error::Underglow test failed"; exit 1; fi
          grep -q "UNDERGLOW TEST OK" underglow.log

      - name: Party test (venues fit on every map, each minigame runs and returns the car)
        run: |
          for t in ridge harbor playground; do
            timeout 600 ./godot --headless --path . res://tests/party_test.tscn -- --track=$t 2>&1 | tee party.log || true
            if grep -E "SCRIPT ERROR" party.log; then echo "::error::Party test failed on $t"; exit 1; fi
            grep -q "PARTY TEST: PASS" party.log
          done

      - name: AI test (three bots race a lap on Ridge and Harbor)
        run: |
          for t in ridge harbor; do
            timeout 600 ./godot --headless --path . res://tests/ai_test.tscn -- --track=$t 2>&1 | tee ai.log || true
            if grep -E "SCRIPT ERROR" ai.log; then echo "::error::AI test failed on $t"; exit 1; fi
            grep -q "AI TEST.*PASS" ai.log
          done

      - name: Tutorial test (house and camp on Grüne Hölle, skip, drive out of the garage, ending)
        run: |
          timeout 600 ./godot --headless --path . res://tests/tutorial_test.tscn 2>&1 | tee tutorial.log || true
          if grep -E "SCRIPT ERROR" tutorial.log; then echo "::error::Tutorial test failed"; exit 1; fi
          grep -q "TUTORIAL TEST: PASS" tutorial.log

      - name: Stability test (quick lane change at 120/170 km/h, with and without ABS/ESP)
        run: |
          timeout 300 ./godot --headless --path . res://tests/stability_test.tscn 2>&1 | tee stab.log || true
          if grep -E "SCRIPT ERROR" stab.log; then echo "::error::Stability test failed"; exit 1; fi
          grep -q "STABILITY TEST: PASS" stab.log
          timeout 300 ./godot --headless --path . res://tests/stability_test.tscn -- --abs --esp 2>&1 | tee stab2.log || true
          grep -q "STABILITY TEST: PASS" stab2.log

      - name: Address test (IPv4/IPv6 parsing, invite code, usable public addresses)
        run: |
          timeout 60 ./godot --headless --path . res://tests/address_test.tscn 2>&1 | tee addr.log || true
          if grep -E "SCRIPT ERROR" addr.log; then echo "::error::Address test failed"; exit 1; fi
          grep -q "ADDRESS TEST: PASS" addr.log

      - name: Idle test (no input = the car stands still, also on a 10 % grade)
        run: |
          timeout 300 ./godot --headless --path . res://tests/idle_test.tscn 2>&1 | tee idle.log || true
          if grep -E "SCRIPT ERROR" idle.log; then echo "::error::Idle test failed"; exit 1; fi
          grep -q "IDLE TEST: PASS" idle.log
          timeout 600 ./godot --headless --path . res://tests/idle_test.tscn -- --track=gruene_hoelle --km=4.3 2>&1 | tee idle2.log || true
          grep -q "IDLE TEST: PASS" idle2.log

      - name: Playground test (props settle, grass islands)
        run: |
          timeout 240 ./godot --headless --path . res://tests/playground_test.tscn 2>&1 | tee playground.log || true
          if grep -E "SCRIPT ERROR" playground.log; then echo "::error::Playground test failed"; exit 1; fi
          grep -q "PLAYGROUND TEST OK" playground.log

      - name: Online test (DTLS + lobby password, right and wrong password)
        run: |
          ./godot --headless --path . res://tests/net_test.tscn -- --role=host --pw=geheim --port=24590 > host.log 2>&1 &
          H1=$!
          sleep 5
          timeout 30 ./godot --headless --path . res://tests/net_test.tscn -- --role=client --pw=geheim --port=24590 2>&1 | tee net.log || true
          wait $H1 || true
          ./godot --headless --path . res://tests/net_test.tscn -- --role=host --pw=geheim --port=24591 > host2.log 2>&1 &
          H2=$!
          sleep 5
          timeout 30 ./godot --headless --path . res://tests/net_test.tscn -- --role=client --pw=falsch --port=24591 2>&1 | tee net2.log || true
          kill $H2 2>/dev/null || true
          cat host.log host2.log
          if grep -E "SCRIPT ERROR" net.log net2.log host.log host2.log; then echo "::error::Online test failed"; exit 1; fi
          grep -q "NET CLIENT IN LOBBY" net.log
          grep -q "NET HOST SEES PLAYER" host.log
          grep -q "NET HOST GRAFFITI from client" host.log
          grep -q "NET CLIENT GRAFFITI ECHO" net.log
          grep -q "Falsches Lobby-Passwort" net2.log

      - name: Short-code join test (rendezvous + hole punching, relay as a local folder)
        run: |
          MD_SIGNAL=file ./godot --headless --path . res://tests/net_test.tscn -- --role=host --pw=geheim --port=24592 > host3.log 2>&1 &
          H3=$!
          sleep 6
          MD_SIGNAL=file timeout 45 ./godot --headless --path . res://tests/net_test.tscn -- --role=client --pw=geheim --port=24592 --mode=code 2>&1 | tee net3.log || true
          wait $H3 || true
          cat host3.log
          if grep -E "SCRIPT ERROR" net3.log host3.log; then echo "::error::Short-code test failed"; exit 1; fi
          grep -q "NET CLIENT IN LOBBY" net3.log
          grep -q "NET HOST SEES PLAYER" host3.log

      - name: Smoke test (headless – scripts, physics, networking)
        run: |
          timeout 300 ./godot --headless --path . -- --smoke-test 2>&1 | tee smoke.log || true
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|MODEL MISSING|loaded=false" smoke.log; then echo "::error::Script errors found"; exit 1; fi
          grep -q "SMOKE TEST OK" smoke.log

      - name: Render test (software Vulkan, screenshots)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libvulkan1 > /dev/null
          mkdir -p "$RUNNER_TEMP/shots"
          timeout 900 xvfb-run -a -s "-screen 0 1600x900x24" ./godot --path . --rendering-driver vulkan -- --smoke-test --quick --shot-dir="$RUNNER_TEMP/shots" 2>&1 | tee render.log || true
          if grep -E "SHADER ERROR|SCRIPT ERROR|shader compilation failed" render.log; then echo "::error::Render errors found"; exit 1; fi
          grep -q "SMOKE TEST OK" render.log

      - name: Upload test logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            check.log
            audio.log
            drive.log
            camera.log
            smoke.log
            render.log
            ${{ runner.temp }}/shots/
          if-no-files-found: ignore

      - name: Export Windows (.exe) and Linux
        run: |
          mkdir -p build/windows build/linux
          ./godot --headless --path . --export-release "Windows Desktop" build/windows/MidnightDrift.exe 2>&1 | tee export.log
          ./godot --headless --path . --export-release "Linux" build/linux/MidnightDrift.x86_64 2>&1 | tee -a export.log
          ls -la build/windows build/linux
          test -s build/windows/MidnightDrift.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: MidnightDrift-Windows
          path: build/windows/

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: MidnightDrift-Linux
          path: build/linux/

      - name: Package release zips
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd build/windows && zip -q -r ../MidnightDrift-Windows.zip . && cd ../..
          cd build/linux && zip -q -r ../MidnightDrift-Linux.zip . && cd ../..

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/MidnightDrift-Windows.zip
            build/MidnightDrift-Linux.zip
