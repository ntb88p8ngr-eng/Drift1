name: Build Midnight Drift

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          set -e
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          tpl="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tpl"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d /tmp/tpl
          mv /tmp/tpl/templates/* "$tpl/"
          rm -f ./*.zip ./*.tpz

      - name: Import project
        run: timeout 300 ./godot --headless --editor --quit --path . 2>&1 | tee import.log || true

      - name: Compile all scripts
        run: |
          timeout 120 ./godot --headless --path . res://tests/check_scripts.tscn 2>&1 | tee check.log || true
          if grep -E "SCRIPT CHECK FAILED|Parse Error|Compile Error|SCRIPT ERROR" check.log; then echo "::error::Script compile errors"; exit 1; fi
          grep -q "SCRIPT CHECK DONE" check.log

      - name: Audio test (engine voices, R34 samples)
        run: |
          mkdir -p "$RUNNER_TEMP/audio"
          timeout 120 ./godot --headless --path . res://tests/audio_test.tscn -- "$RUNNER_TEMP/audio" 2>&1 | tee audio.log || true
          if grep -E "SCRIPT ERROR|AUDIO NAN|AUDIO SAMPLES MISSING" audio.log; then echo "::error::Audio test failed"; exit 1; fi
          grep -q "AUDIO TEST DONE" audio.log
          timeout 60 ./godot --headless --path . res://tests/rain_audio_test.tscn -- "$RUNNER_TEMP/audio" 2>&1 | tee -a audio.log || true
          grep -q "RAIN TEST DONE" audio.log

      - name: Drive test (terrain collision, gearing, weather grip)
        run: |
          timeout 240 ./godot --headless --path . res://tests/drive_test.tscn 2>&1 | tee drive.log || true
          if grep -E "SCRIPT ERROR" drive.log; then echo "::error::Drive test failed"; exit 1; fi
          grep -q "DRIVE m3gt3 y range" drive.log

      - name: Camera test (no jitter at 75 fps with 120 Hz physics)
        run: |
          timeout 240 ./godot --headless --fixed-fps 75 --path . res://tests/camera_test.tscn 2>&1 | tee camera.log || true
          if grep -E "SCRIPT ERROR" camera.log; then echo "::error::Camera test failed"; exit 1; fi
          grep -q "CAMERA TEST OK" camera.log

      - name: Collision test (breakable lamp, solid grandstand)
        run: |
          timeout 240 ./godot --headless --path . res://tests/collision_test.tscn 2>&1 | tee collision.log || true
          if grep -E "SCRIPT ERROR" collision.log; then echo "::error::Collision test failed"; exit 1; fi
          grep -q "COLLISION TEST OK" collision.log

      - name: Playground test (props settle, grass islands)
        run: |
          timeout 240 ./godot --headless --path . res://tests/playground_test.tscn 2>&1 | tee playground.log || true
          if grep -E "SCRIPT ERROR" playground.log; then echo "::error::Playground test failed"; exit 1; fi
          grep -q "PLAYGROUND TEST OK" playground.log

      - name: Online test (DTLS + lobby password, right and wrong password)
        run: |
          ./godot --headless --path . res://tests/net_test.tscn -- --role=host --pw=geheim --port=24590 > host.log 2>&1 &
          H1=$!
          sleep 5
          timeout 30 ./godot --headless --path . res://tests/net_test.tscn -- --role=client --pw=geheim --port=24590 2>&1 | tee net.log || true
          wait $H1 || true
          ./godot --headless --path . res://tests/net_test.tscn -- --role=host --pw=geheim --port=24591 > host2.log 2>&1 &
          H2=$!
          sleep 5
          timeout 30 ./godot --headless --path . res://tests/net_test.tscn -- --role=client --pw=falsch --port=24591 2>&1 | tee net2.log || true
          kill $H2 2>/dev/null || true
          cat host.log host2.log
          if grep -E "SCRIPT ERROR" net.log net2.log host.log host2.log; then echo "::error::Online test failed"; exit 1; fi
          grep -q "NET CLIENT IN LOBBY" net.log
          grep -q "NET HOST SEES PLAYER" host.log
          grep -q "NET HOST GRAFFITI from client" host.log
          grep -q "NET CLIENT GRAFFITI ECHO" net.log
          grep -q "Falsches Lobby-Passwort" net2.log

      - name: Smoke test (headless – scripts, physics, networking)
        run: |
          timeout 300 ./godot --headless --path . -- --smoke-test 2>&1 | tee smoke.log || true
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|MODEL MISSING|loaded=false" smoke.log; then echo "::error::Script errors found"; exit 1; fi
          grep -q "SMOKE TEST OK" smoke.log

      - name: Render test (software Vulkan, screenshots)
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libvulkan1 > /dev/null
          mkdir -p "$RUNNER_TEMP/shots"
          timeout 900 xvfb-run -a -s "-screen 0 1600x900x24" ./godot --path . --rendering-driver vulkan -- --smoke-test --quick --shot-dir="$RUNNER_TEMP/shots" 2>&1 | tee render.log || true
          if grep -E "SHADER ERROR|SCRIPT ERROR|shader compilation failed" render.log; then echo "::error::Render errors found"; exit 1; fi
          grep -q "SMOKE TEST OK" render.log

      - name: Upload test logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            check.log
            audio.log
            drive.log
            camera.log
            smoke.log
            render.log
            ${{ runner.temp }}/shots/
          if-no-files-found: ignore

      - name: Export Windows (.exe) and Linux
        run: |
          mkdir -p build/windows build/linux
          ./godot --headless --path . --export-release "Windows Desktop" build/windows/MidnightDrift.exe 2>&1 | tee export.log
          ./godot --headless --path . --export-release "Linux" build/linux/MidnightDrift.x86_64 2>&1 | tee -a export.log
          ls -la build/windows build/linux
          test -s build/windows/MidnightDrift.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: MidnightDrift-Windows
          path: build/windows/

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: MidnightDrift-Linux
          path: build/linux/

      - name: Package release zips
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd build/windows && zip -q -r ../MidnightDrift-Windows.zip . && cd ../..
          cd build/linux && zip -q -r ../MidnightDrift-Linux.zip . && cd ../..

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/MidnightDrift-Windows.zip
            build/MidnightDrift-Linux.zip
